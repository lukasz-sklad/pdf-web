<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <meta name="color-scheme" content="dark">
  <title>PDFCraft — Edytor PDF &amp; Lektor PL</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <link rel="icon" type="image/x-icon" href="./favicon.ico">
  <link rel="modulepreload" href="./pdfcraft-web-8e205690ff028465.js">
  <link rel="preload" href="./pdfcraft-web-8e205690ff028465_bg.wasm" as="fetch" type="application/wasm" crossorigin="anonymous">
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #19191c;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #e0e0e0;
    }
    #pdfcraft {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      outline: none;
    }
    #pdfcraft_loading {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #19191c;
      z-index: 100;
      padding: 24px;
      text-align: center;
      user-select: none;
    }
    .loading-card {
      background: #232328;
      border: 1px solid #35353d;
      border-radius: 12px;
      padding: 32px 28px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .app-icon {
      width: 56px;
      height: 56px;
      margin-bottom: 4px;
    }
    .app-title {
      font-size: 22px;
      font-weight: 700;
      color: #ffffff;
      margin: 0;
      letter-spacing: -0.3px;
    }
    .app-subtitle {
      font-size: 13px;
      color: #9e9e9e;
      margin: 0;
    }
    .progress-container {
      width: 100%;
      background: #151518;
      border-radius: 8px;
      height: 8px;
      overflow: hidden;
      position: relative;
      margin: 8px 0 4px;
      border: 1px solid #303038;
    }
    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #ef4444, #f97316);
      border-radius: 8px;
      transition: width 0.15s ease-out;
    }
    .progress-info {
      width: 100%;
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: #888888;
    }
    .status-text {
      font-size: 14px;
      color: #d1d5db;
      min-height: 20px;
    }
    .error-box {
      display: none;
      background: #3b1818;
      border: 1px solid #7f1d1d;
      color: #fca5a5;
      padding: 14px;
      border-radius: 8px;
      font-size: 13px;
      text-align: left;
      width: 100%;
      line-height: 1.4;
      word-break: break-word;
    }
    .error-box a {
      color: #93c5fd;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <canvas id="pdfcraft"></canvas>

  <div id="pdfcraft_loading">
    <div class="loading-card">
      <img src="./favicon.svg" alt="PDFCraft" class="app-icon">
      <h1 class="app-title">PDFCraft Web</h1>
      <p class="app-subtitle">Edytor PDF &bull; OCR &bull; Adnotacje &bull; Lektor PL</p>

      <div class="status-text" id="status_text">Inicjalizacja pobierania…</div>

      <div class="progress-container">
        <div class="progress-bar" id="progress_bar"></div>
      </div>

      <div class="progress-info">
        <span id="progress_bytes">0 MB / ~14 MB</span>
        <span id="progress_pct">0%</span>
      </div>

      <div class="error-box" id="error_box"></div>
    </div>
  </div>

  <script type="module">
    import init, * as bindings from './pdfcraft-web-8e205690ff028465.js';

    const statusEl = document.getElementById('status_text');
    const progressBar = document.getElementById('progress_bar');
    const progressBytes = document.getElementById('progress_bytes');
    const progressPct = document.getElementById('progress_pct');
    const errorBox = document.getElementById('error_box');

    function setStatus(text) {
      if (statusEl) statusEl.textContent = text;
    }

    function setProgress(loaded, total) {
      const pct = Math.min(100, Math.max(0, Math.round((loaded / total) * 100)));
      if (progressBar) progressBar.style.width = pct + '%';
      if (progressPct) progressPct.textContent = pct + '%';
      const loadedMB = (loaded / (1024 * 1024)).toFixed(1);
      const totalMB = (total / (1024 * 1024)).toFixed(1);
      if (progressBytes) progressBytes.textContent = `${loadedMB} MB / ${totalMB} MB`;
    }

    function showError(err) {
      if (statusEl) statusEl.textContent = 'Błąd uruchamiania';
      if (errorBox) {
        errorBox.style.display = 'block';
        errorBox.innerHTML = `
          <strong>Wystąpił problem:</strong><br>
          ${err?.message || err || 'Nieznany błąd'}<br><br>
          <a href="javascript:location.reload()">Odśwież stronę</a>
        `;
      }
    }

    async function start() {
      try {
        setStatus('Pobieranie silnika PDFCraft (WebAssembly)…');
        const wasmUrl = './pdfcraft-web-8e205690ff028465_bg.wasm';
        const response = await fetch(wasmUrl);

        if (!response.ok) {
          throw new Error(`Nie udało się pobrać silnika WebAssembly: HTTP ${response.status} ${response.statusText}`);
        }

        const contentLength = response.headers.get('content-length');
        const expectedBytes = contentLength ? parseInt(contentLength, 10) : 14680064;

        let wasmModuleOrBuffer;

        if (response.body && typeof response.body.getReader === 'function') {
          const reader = response.body.getReader();
          let loaded = 0;
          const chunks = [];

          while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            chunks.push(value);
            loaded += value.length;
            const activeTotal = (expectedBytes < 25000000 && loaded > 20000000) ? 41849913 : Math.max(expectedBytes, loaded);
            setProgress(loaded, activeTotal);
          }

          setStatus('Inicjalizacja silnika PDF i czcionek…');
          if (progressPct) progressPct.textContent = '100%';
          if (progressBar) progressBar.style.width = '100%';

          const fullBuffer = new Uint8Array(loaded);
          let offset = 0;
          for (const chunk of chunks) {
            fullBuffer.set(chunk, offset);
            offset += chunk.length;
          }
          wasmModuleOrBuffer = fullBuffer;
        } else {
          wasmModuleOrBuffer = await response.arrayBuffer();
        }

        setStatus('Uruchamianie interfejsu PDFCraft…');
        const wasm = await init({ module_or_path: wasmModuleOrBuffer });

        window.wasmBindings = bindings;
        window.dispatchEvent(new CustomEvent("TrunkApplicationStarted", { detail: { wasm } }));

        setTimeout(() => {
          const el = document.getElementById('pdfcraft_loading');
          if (el) el.remove();
        }, 400);
      } catch (err) {
        console.error('PDFCraft Web startup error:', err);
        showError(err);
      }
    }

    start();
  </script>
</body>
</html>
